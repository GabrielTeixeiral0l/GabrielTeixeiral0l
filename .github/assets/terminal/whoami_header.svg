<svg fill="none" viewBox="0 0 600 45" width="600" height="45" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          background: #282a36;
          padding: 12px 15px;
          font-family: 'JetBrains Mono', monospace;
          color: #f8f8f2;
          border-radius: 8px 8px 0 0;
          font-size: 14px;
        }
        .prompt { color: #48B9C7; font-weight: bold; }
        .dir { color: #bd93f9; }
        .cmd { color: #f8f8f2; }
        .cursor {
          background: #f8f8f2;
          display: inline-block;
          width: 8px;
          height: 15px;
          vertical-align: middle;
          margin-left: 5px;
          animation: blink 1s step-end infinite;
        }
        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }
      </style>
      <div class="terminal">
        <div><span class="prompt">gabriel@pop-os</span>:<span class="dir">~</span>$ <span class="cmd">run whoami</span><span class="cursor"></span></div>
      </div>
    </div>
  </foreignObject>
</svg>