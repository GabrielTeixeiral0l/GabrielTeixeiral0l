<svg fill="none" viewBox="0 0 600 145" width="600" height="145" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          background: #282a36;
          padding: 15px;
          font-family: 'JetBrains Mono', monospace;
          color: #f8f8f2;
          border-radius: 8px;
          line-height: 1.5;
          font-size: 14px;
        }
        .prompt { color: #48B9C7; font-weight: bold; }
        .dir { color: #bd93f9; }
        .cmd { color: #f8f8f2; }
        .label { color: #ff79c6; font-weight: bold; }
        .value { color: #f8f8f2; }
        .link { color: #50fa7b; text-decoration: none; }
        .quote { color: #f1fa8c; }
        .meta { color: #6272a4; }
        .cursor {
          background: #f8f8f2;
          display: inline-block;
          width: 8px;
          height: 15px;
          vertical-align: middle;
          margin-left: 5px;
          animation: blink 1s step-end infinite;
        }
        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }
        .grid { display: flex; gap: 20px; }
        .col { flex: 1; }
      </style>
      <div class="terminal">
        <div><span class="prompt">gabriel@pop-os</span>:<span class="dir">~</span>$ <span class="cmd">cat stack.conf</span><span class="cursor"></span></div>
        <div style="margin-top: 10px;">
          
  <div class="grid">
    <div class="col">
      <span class="label">🐧 System &amp; Tools</span><br/>
      &nbsp;&nbsp;- Linux (Pop!_OS)<br/>
      &nbsp;&nbsp;- Bash / Git / Docker<br/>
      &nbsp;&nbsp;- Neovim / VS Code
    </div>
    <div class="col">
      <span class="label">⚙️ Fullstack Stack</span><br/>
      &nbsp;&nbsp;- C# / .NET<br/>
      &nbsp;&nbsp;- Node.js / React<br/>
      &nbsp;&nbsp;- SQL Server / PostgreSQL
    </div>
  </div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>