<svg fill="none" viewBox="0 0 600 65" width="600" height="65" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          background: #282a36;
          padding: 10px 15px;
